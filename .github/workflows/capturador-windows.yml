# Construye Capturador.exe y su instalador en una máquina Windows de GitHub.
# El instalador queda en la pestaña Actions > esta ejecución > Artifacts.
name: Capturador para Windows

on:
  push:
    branches: [claude/adoring-darwin-pktdfp]
    paths: ["capturador/**", ".github/workflows/capturador-windows.yml"]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r capturador/requirements.txt pyinstaller

      - name: Crear Capturador.exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name Capturador
          --icon capturador/icono.ico --add-data "capturador/icono.ico;."
          --paths capturador --collect-data customtkinter --collect-submodules dxcam
          --hidden-import pystray._win32 --hidden-import win32com.propsys --hidden-import win32com.shell
          --hidden-import crear_acceso_directo
          capturador/lanzador.py

      - name: Autoprueba del .exe
        shell: pwsh
        run: |
          $resultado = "$env:RUNNER_TEMP\autoprueba.txt"
          $p = Start-Process -FilePath "dist\Capturador\Capturador.exe" -ArgumentList "--autoprueba", $resultado -Wait -PassThru
          Get-Content $resultado
          if ($p.ExitCode -ne 0) { throw "La autoprueba falló (código $($p.ExitCode))" }

      - name: Crear el instalador
        id: instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path capturador\capturador.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "Versión $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          & $iscc "/DVersion=$version" capturador\instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }

      - uses: actions/upload-artifact@v4
        with:
          name: Capturador-Setup-v${{ steps.instalador.outputs.version }}
          path: Output/Capturador-Setup-*.exe
          retention-days: 90
